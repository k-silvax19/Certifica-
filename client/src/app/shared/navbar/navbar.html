<aside class="app-sidebar">
  <a routerLink="/" class="brand" aria-label="Insignia, página inicial"
    ><span class="brand-symbol" aria-hidden="true">▤<span>✦</span></span
    ><span>Insignia</span></a
  >
  <p class="sidebar-caption">ESPAÇO DA INSTITUIÇÃO</p>
  <nav class="sidebar-links" aria-label="Navegação principal">
    <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }"
      ><span aria-hidden="true">⌂</span> Home</a
    >
    @if (sessaoAutenticada()) {
      <a routerLink="/cursos" routerLinkActive="is-active"
        ><span aria-hidden="true">◇</span> Cursos
        <span class="nav-arrow" aria-hidden="true">⌄</span></a
      >
      <a routerLink="/cursos/cadastrar" routerLinkActive="is-active"
        ><span aria-hidden="true">⊕</span> Cadastrar curso</a
      >
    }
  </nav>
  <div class="sidebar-account">
    @if (sessaoAutenticada(); as sessao) {
      <div class="account-profile">
        <span class="account-avatar" aria-hidden="true">{{
          sessao.usuario.email.charAt(0).toUpperCase()
        }}</span>
        <div>
          <span class="account-email">{{ sessao.usuario.email }}</span>
        </div>
      </div>
      <button type="button" (click)="authService.encerrarSessao()">
        <span aria-hidden="true">↪</span> Sair da conta
      </button>
    } @else {
      <a routerLink="/login"><span aria-hidden="true">↪</span> Entrar na conta</a>
    }
    <p class="sidebar-footer">Insignia · 2026</p>
  </div>
</aside>
