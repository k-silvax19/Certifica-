<aside class="app-sidebar">
  <a routerLink="/" class="brand" aria-label="Insignia, página inicial"
    ><svg lucideFileText class="size-6 text-indigo-600" aria-hidden="true"></svg
    ><span>Insignia</span></a
  >
  <nav class="sidebar-links mt-10" aria-label="Navegação principal">
    <a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }"
      ><svg lucideHouse class="size-4" aria-hidden="true"></svg>Início</a
    >
    @if (sessaoAutenticada()) {
      <a routerLink="/cursos/listar" routerLinkActive="is-active"
        ><svg lucideBookOpen class="size-4" aria-hidden="true"></svg>Cursos</a
      >
      <a routerLink="/cursos/cadastrar" routerLinkActive="is-active"
        ><svg lucidePlus class="size-4" aria-hidden="true"></svg>Cadastrar curso</a
      >
    }
  </nav>
  <div class="sidebar-account">
    @if (sessaoAutenticada(); as sessao) {
      <div class="account-profile">
        <span class="account-email" [title]="sessao.usuario.email">{{ sessao.usuario.email }}</span>
      </div>
      <button type="button" (click)="authService.encerrarSessao()">
        <svg lucideLogOut class="size-4" aria-hidden="true"></svg>Sair da conta
      </button>
    } @else {
      <a routerLink="/login"><svg lucideLogOut class="size-4" aria-hidden="true"></svg>Entrar</a>
    }
    <p class="sidebar-footer">© 2026 Insignia</p>
  </div>
</aside>
